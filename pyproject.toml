[project]
name = "curso-rl-recsys"
version = "0.1.0"
description = "Plantilla base del modulo Aprendizaje por Refuerzo y Sistemas de Recomendacion - UPTC"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Se instala en el Bloque 1. No hace falta para la prueba de paso.
# torch acotado a <2.3: desde esa version PyTorch dejo de publicar binarios
# para macOS Intel (x86_64), y en Mac Intel `uv sync` fallaba al resolver.
# numpy<2 porque ese torch se compilo contra el ABI de NumPy 1.x; mezclarlo
# con NumPy 2.x no falla al importar, pero puede colapsar en cualquier
# conversion tensor <-> array (justo lo que hacen dqn.py y pg.py).
dl = ["torch>=2.2,<2.3", "numpy<2"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlrs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# ``retos/`` no es un paquete instalado: es donde el estudiante escribe sus
# respuestas. Sin esta linea, las pruebas de los retos no lo encuentran.
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
